<!DOCTYPE html>
<html>
<head>
    <title>BookSphere AI</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">📚 BookSphere</a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
    <a class="nav-link" href="{% url 'book_list' %}">Books</a>
</li>


        {% if user.is_authenticated %}
            <li class="nav-item">
                <span class="nav-link">Hello, {{ user.username }}</span>
            </li>
            <li class="nav-item">
                <a class="nav-link btn btn-danger text-white px-3 ms-2" href="{% url 'logout' %}">Logout</a>
            </li>
        {% else %}
            <li class="nav-item">
                <a class="nav-link btn btn-outline-light px-3 me-2" href="{% url 'login' %}">Login</a>
            </li>
            <li class="nav-item">
                <a class="nav-link btn btn-warning px-3 text-dark" href="{% url 'signup' %}">Sign Up</a>
            </li>
        {% endif %}

      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
